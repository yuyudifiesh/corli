<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录舰船端口</title>
    <style>
        /* 全局重置 + 黑色背景 + 极简风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        .login-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.8rem;
            width: 100%;
            max-width: 400px;
            padding: 1.5rem 1.2rem;
            background: transparent;
        }

        .code-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            max-width: 300px;
        }

        .code-digit {
            width: 3.75rem;
            height: 4.2rem;
            background-color: #000000;
            border: 1.5px solid #ffffff;
            border-radius: 12px;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 300;
            text-align: center;
            outline: none;
            transition: border-color 0.2s ease;
            caret-color: #ffffff;
            padding: 0;
            line-height: 1;
            letter-spacing: 0;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .code-digit::-webkit-outer-spin-button,
        .code-digit::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .code-digit:focus {
            border-color: #f0f0f0;
        }

        .code-digit::placeholder {
            color: #333333;
            font-size: 1rem;
            font-weight: 300;
        }

        /* 绿色描边 (正确) */
        .code-digit.correct {
            border-color: #00ff41 !important;
        }

        /* 红色描边 (错误) */
        .code-digit.error {
            border-color: #ff0033 !important;
        }

        .verify-btn {
            padding: 0.6rem 2.2rem;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: none;
            text-align: center;
            line-height: 1.4;
            box-shadow: none;
            outline: none;
            min-width: 100px;
        }

        .verify-btn:hover,
        .verify-btn:active,
        .verify-btn:focus {
            background-color: #ffffff;
            color: #000000;
            transform: none;
            box-shadow: none;
            opacity: 1;
        }

        .message {
            color: #aaaaaa;
            font-size: 0.9rem;
            text-align: center;
            min-height: 1.5rem;
            margin-top: -0.2rem;
            font-weight: 300;
            letter-spacing: 0.2px;
            background: transparent;
            border: none;
            width: 100%;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 420px) {
            .code-digit {
                width: 3.2rem;
                height: 3.6rem;
                font-size: 1.8rem;
            }
            .code-group {
                gap: 0.5rem;
                max-width: 260px;
            }
            .verify-btn {
                padding: 0.5rem 1.8rem;
                font-size: 1rem;
                min-width: 80px;
            }
        }

        @media (max-width: 350px) {
            .code-digit {
                width: 2.6rem;
                height: 3rem;
                font-size: 1.5rem;
            }
            .code-group {
                gap: 0.4rem;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="code-group" role="group" aria-label="四位验证码输入">
            <input type="text" class="code-digit" id="digit1" maxlength="1" inputmode="numeric" pattern="\d" autocomplete="off" aria-label="第一位数字" placeholder="·">
            <input type="text" class="code-digit" id="digit2" maxlength="1" inputmode="numeric" pattern="\d" autocomplete="off" aria-label="第二位数字" placeholder="·">
            <input type="text" class="code-digit" id="digit3" maxlength="1" inputmode="numeric" pattern="\d" autocomplete="off" aria-label="第三位数字" placeholder="·">
            <input type="text" class="code-digit" id="digit4" maxlength="1" inputmode="numeric" pattern="\d" autocomplete="off" aria-label="第四位数字" placeholder="·">
        </div>

        <button id="verifyBtn" class="verify-btn">验证</button>
        <div id="messageArea" class="message"></div>
    </main>

    <script>
        (function() {
            "use strict";

            // ===== 校验值开关 =====
            // 如果设置为 false，则无论输入什么都会判定为错误
            const ENABLE_VALIDATION = false;  // 改为 false 可禁用正确验证

            // 正确密码
            const CORRECT_PASSWORD = "4290";

            // DOM 元素
            const d1 = document.getElementById('digit1');
            const d2 = document.getElementById('digit2');
            const d3 = document.getElementById('digit3');
            const d4 = document.getElementById('digit4');
            const digits = [d1, d2, d3, d4];
            const verifyBtn = document.getElementById('verifyBtn');
            const messageEl = document.getElementById('messageArea');

            // 状态锁：防止在跳转/刷新期间重复操作
            let isProcessing = false;

            // 清空消息
            messageEl.textContent = '';

            // ---- 输入控制逻辑 (不变) ----
            function enforceSingleDigit(e) {
                const input = e.target;
                let val = input.value.replace(/\D/g, '');
                if (val.length > 1) {
                    val = val.slice(0, 1);
                }
                input.value = val;
                return val;
            }

            function handleInput(e) {
                const input = e.target;
                let val = input.value.replace(/\D/g, '');
                if (val.length > 1) {
                    val = val.slice(0, 1);
                }
                input.value = val;

                if (val.length === 1) {
                    const currentIndex = digits.indexOf(input);
                    if (currentIndex !== -1 && currentIndex < digits.length - 1) {
                        const next = digits[currentIndex + 1];
                        if (next) {
                            next.focus();
                        }
                    }
                }
                messageEl.textContent = '';
                // 当用户重新输入时，清除所有框的颜色状态
                clearInputStyles();
            }

            function handleKeyDown(e) {
                const input = e.target;
                const currentIndex = digits.indexOf(input);

                if (e.key === 'Backspace' || e.key === 'Delete') {
                    if (input.value === '') {
                        if (currentIndex > 0) {
                            const prev = digits[currentIndex - 1];
                            if (prev) {
                                prev.value = '';
                                prev.focus();
                                e.preventDefault();
                            }
                        }
                    } else {
                        input.value = '';
                        e.preventDefault();
                    }
                    messageEl.textContent = '';
                    clearInputStyles();
                    return;
                }

                if (e.key === 'ArrowLeft') {
                    if (currentIndex > 0) {
                        const prev = digits[currentIndex - 1];
                        if (prev) {
                            prev.focus();
                            e.preventDefault();
                        }
                    }
                    return;
                }

                if (e.key === 'ArrowRight') {
                    if (currentIndex < digits.length - 1) {
                        const next = digits[currentIndex + 1];
                        if (next) {
                            next.focus();
                            e.preventDefault();
                        }
                    }
                    return;
                }
            }

            function handlePaste(e) {
                e.preventDefault();
                const clipboardData = e.clipboardData || window.clipboardData;
                if (!clipboardData) return;
                let pasted = clipboardData.getData('text/plain') || '';
                pasted = pasted.replace(/\D/g, '');
                if (pasted.length === 0) return;

                const input = e.target;
                const startIndex = digits.indexOf(input);
                if (startIndex === -1) return;

                let pasteIndex = startIndex;
                for (let i = 0; i < pasted.length && pasteIndex < digits.length; i++) {
                    const char = pasted[i];
                    if (char >= '0' && char <= '9') {
                        digits[pasteIndex].value = char;
                        pasteIndex++;
                    }
                }
                if (pasteIndex > startIndex && pasteIndex <= digits.length) {
                    const focusIndex = pasteIndex - 1;
                    digits[focusIndex].focus();
                } else if (pasteIndex === digits.length) {
                    digits[digits.length - 1].focus();
                }
                messageEl.textContent = '';
                clearInputStyles();
            }

            // 清除所有输入框的颜色样式
            function clearInputStyles() {
                digits.forEach(input => {
                    input.classList.remove('correct', 'error');
                });
            }

            // 为每个输入框绑定事件
            digits.forEach((input, index) => {
                input.addEventListener('input', handleInput);
                input.addEventListener('keydown', handleKeyDown);
                input.addEventListener('paste', handlePaste);
                input.addEventListener('focus', function() {
                    this.select();
                });
                input.addEventListener('blur', function() {
                    const val = this.value.replace(/\D/g, '');
                    if (val.length > 1) {
                        this.value = val.slice(0, 1);
                    } else {
                        this.value = val;
                    }
                });
                input.addEventListener('wheel', function(e) {
                    e.preventDefault();
                }, { passive: false });
            });

            // 获取四位数字
            function getCode() {
                let code = '';
                for (let i = 0; i < digits.length; i++) {
                    const val = digits[i].value.trim();
                    if (val.length === 1 && val >= '0' && val <= '9') {
                        code += val;
                    } else {
                        code += '';
                    }
                }
                return code;
            }

            // 重置所有输入框 (清空内容和样式)
            function resetAllInputs() {
                digits.forEach(input => {
                    input.value = '';
                    input.classList.remove('correct', 'error');
                });
                messageEl.textContent = '';
                isProcessing = false;
            }

            // 显示错误状态 (红色描边)
            function showError() {
                digits.forEach(input => {
                    input.classList.remove('correct');
                    input.classList.add('error');
                });
                messageEl.textContent = '密码错误';
            }

            // 显示正确状态 (绿色描边)
            function showCorrect() {
                digits.forEach(input => {
                    input.classList.remove('error');
                    input.classList.add('correct');
                });
                messageEl.textContent = '验证通过，即将跳转...';
            }

            // 验证并处理
            function handleVerify() {
                // 如果正在处理中，忽略重复点击
                if (isProcessing) return;

                let code = getCode();

                // 检查是否4位数字
                if (code.length !== 4) {
                    messageEl.textContent = '请输入四位数字';
                    // 聚焦到第一个空框
                    for (let i = 0; i < digits.length; i++) {
                        if (digits[i].value === '') {
                            digits[i].focus();
                            break;
                        }
                    }
                    return;
                }

                // ---- 核心验证逻辑 ----
                // 如果 ENABLE_VALIDATION 为 false，则无论输入什么都判定为错误
                let isCorrect = false;
                if (ENABLE_VALIDATION) {
                    isCorrect = (code === CORRECT_PASSWORD);
                } else {
                    isCorrect = false;  // 校验值关闭，永远错误
                }

                // 锁定界面，防止重复操作
                isProcessing = true;

                if (isCorrect) {
                    // ---- 正确：绿色描边 + 3秒后跳转 ----
                    showCorrect();

                    // 3秒后跳转到指定页面
                    setTimeout(() => {
                        // 跳转到默认地址 (不再拼接)
                        window.location.href = 'https://yuyudifiesh.github.io/corli/';
                    }, 3000);

                } else {
                    // ---- 错误：红色描边 + 3秒后刷新清空 ----
                    showError();

                    // 3秒后刷新页面并清空输入内容
                    setTimeout(() => {
                        // 重置所有输入框 (清空内容+移除样式)
                        resetAllInputs();
                        // 额外确保 message 清空
                        messageEl.textContent = '';
                        // 解锁 (但重置已经解锁)
                        isProcessing = false;
                        // 聚焦到第一个输入框
                        d1.focus();
                    }, 3000);
                }
            }

            verifyBtn.addEventListener('click', handleVerify);

            digits.forEach(input => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleVerify();
                    }
                });
            });

            d1.focus();

            document.addEventListener('submit', function(e) {
                if (e.target && e.target.tagName === 'FORM') {
                    e.preventDefault();
                }
            });

            console.log('🔐 验证系统已启动 | 正确密码: 4290 | 校验开关:', ENABLE_VALIDATION);
        })();
    </script>
</body>
</html>
