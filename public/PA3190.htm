<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <title>记忆 · 远行的计划</title>
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
            scrollbar-width: none;
            -ms-overflow-style: none;
            overflow: -moz-scrollbars-none;
        }

        button,
        .option-btn {
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
            outline: none !important;
            -webkit-touch-callout: none;
        }

        button:focus,
        button:active,
        .option-btn:focus,
        .option-btn:active {
            outline: 0 !important;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            min-height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Serif SC', 'FangSong', '华文仿宋', 'STFangsong', 'Times New Roman', serif;
            transition: background-color 1.2s ease;
            padding: 1.5rem;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 820px;
            width: 100%;
            text-align: center;
            padding: 2rem 1.5rem;
            border-radius: 0;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
        }

        .question-area {
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            -webkit-tap-highlight-color: transparent;
        }

        .question-text {
            color: #f0f0f0;
            font-size: 2rem;
            line-height: 1.7;
            letter-spacing: 0.06em;
            font-weight: 400;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.05);
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 4.5rem;
            transition: color 0.3s;
            font-family: 'Noto Serif SC', 'FangSong', '华文仿宋', 'STFangsong', serif;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
        }

        .options-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.9rem;
            margin-top: 1.8rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            width: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        .options-area.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .option-item {
            list-style: none;
            width: 100%;
            max-width: 560px;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }

        .option-btn {
            background: transparent;
            border: none;
            color: #d0d0d0;
            font-family: 'Noto Serif SC', 'FangSong', '华文仿宋', 'STFangsong', serif;
            font-size: 1.4rem;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.08em;
            text-decoration: underline;
            text-underline-offset: 6px;
            text-decoration-thickness: 1px;
            text-decoration-color: #777;
            background: none;
            box-shadow: none;
            border-radius: 0;
            backdrop-filter: none;
            width: auto;
            display: inline-block;
            line-height: 1.8;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
            outline: none !important;
            -webkit-touch-callout: none;
        }

        .option-btn:hover {
            color: #ffffff;
            text-decoration-color: #ffffff;
            text-decoration-thickness: 2px;
            transform: scale(1.02);
        }

        .option-btn:active {
            transform: scale(0.96);
            opacity: 0.7;
            outline: 0 !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        .option-btn:focus {
            outline: 0 !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        .transition-line {
            color: #b0b0b0;
            font-size: 1.2rem;
            letter-spacing: 0.06em;
            margin: 1.8rem 0 0.8rem 0;
            font-style: italic;
            opacity: 0.75;
            border-top: 1px dashed #444;
            padding-top: 1.8rem;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            transition: opacity 0.3s;
            font-family: 'Noto Serif SC', 'FangSong', '华文仿宋', 'STFangsong', serif;
            -webkit-tap-highlight-color: transparent;
            white-space: pre-wrap;
            line-height: 2.2;
        }

        .end-message {
            font-size: 2.2rem;
            letter-spacing: 0.06em;
            line-height: 1.6;
            padding: 1.2rem;
            font-weight: 400;
            font-family: 'Noto Serif SC', 'FangSong', '华文仿宋', 'STFangsong', serif;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
        }

        .end-message.light {
            color: #1e1e1e;
        }

        .end-message.dark {
            color: #f0f0f0;
        }

        .reset-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.8rem;
            font-family: 'Noto Serif SC', 'FangSong', '华文仿宋', serif;
            letter-spacing: 0.1em;
            pointer-events: none;
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        .reset-hint.visible {
            opacity: 1;
        }

        body.bg-light .reset-hint {
            color: rgba(0, 0, 0, 0.12);
        }

        @media (max-width: 600px) {
            .question-text {
                font-size: 1.6rem;
                min-height: 3.8rem;
            }
            .option-btn {
                font-size: 1.2rem;
                padding: 0.2rem 0.4rem;
                text-underline-offset: 4px;
            }
            .transition-line {
                font-size: 1rem;
                width: 95%;
            }
            .end-message {
                font-size: 1.6rem;
            }
            .reset-hint {
                font-size: 0.6rem;
                bottom: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="appContainer">
        <div class="question-area" id="questionArea">
            <div class="question-text" id="questionText"></div>
            <ul class="options-area" id="optionsArea">
                <li class="option-item"><button class="option-btn" id="optionA">A</button></li>
                <li class="option-item"><button class="option-btn" id="optionB">B</button></li>
            </ul>
        </div>
        <div class="transition-line" id="transitionLine"></div>
    </div>

    <div class="reset-hint" id="resetHint">长按结束文本 10 秒可重置进度</div>

    <script>
        (function() {
            'use strict';

            // ---------- 题库 ----------
            const QUESTIONS = [
                { question: '你好啊，我们又见面了。', options: ['是的。', '上一次过去很久了。'], flags: ['T', 'T'] },
                { question: '我们又回到了那个问题：创世者如何创造人类？', options: ['给予人类以智慧。', '给予人类以力量。'], flags: ['T', 'F'] },
                { question: '土地何以承载生命？', options: ['生命改造土地来获取生存的土壤。', '生命妥协土地所带来的苦难来发展文明。'], flags: ['F', 'T'] },
                { question: '最近发生的很多事情对你来说是否有点无法接受？', options: ['同意。', '不同意。'], flags: ['T', 'F'] },
                { question: '那些人们都在看着你，你有没有认为自己被赋予了难以看到希望的使命？', options: ['是的。', '不是。'], flags: ['T', 'F'] },
                { question: '个体生命的价值会因其认知与行为能力而在群体内产生差异。', options: ['同意。', '不同意。'], flags: ['T', 'F'] },
                { question: '文明的价值可以被衡量和比较。', options: ['同意。', '不同意。'], flags: ['T', 'F'] },
                { question: '后世对我们的评价，远比我们这一代人的幸福更重要。', options: ['同意。', '不同意。'], flags: ['F', 'T'] },
                { question: '所有文明最终都会消亡，因此永恒的时间不能作为价值尺度。', options: ['同意。', '不同意。'], flags: ['T', 'F'] },
                { question: '为了文明在未来五百年的存续，今天牺牲十分之一的人口是可接受的。', options: ['同意。', '不同意。'], flags: ['T', 'F'] },
                { question: '文明存在与其发展的目的间接构成了文明群体中个体生命的行为准则。', options: ['同意。', '不同意。'], flags: ['T', 'F'] },
                { question: '生物生命不是唯一的生命形态，在文明发展中，个体生命的形态可以有所改变。', options: ['同意。', '不同意。'], flags: ['T', 'F'] },
                { question: '注定不会实现的希望是一种无法原谅的谎言。', options: ['同意。', '不同意。'], flags: ['T', 'F'] },
                { question: '不是出于私心的隐瞒应该被原谅。', options: ['同意。', '不同意。'], flags: ['T', 'F'] },
                { question: '我们不应该拯救他们。', options: ['同意。', '不同意。'], flags: ['T', 'F'] },
                { question: '故事的结局正在改变。', options: ['同意。', '不同意。'], flags: ['T', 'F'] }
            ];

            // ---------- 状态变量 ----------
            let currentIndex = 0;
            let tCount = 0, fCount = 0;
            let tCountFromQ6 = 0, fCountFromQ6 = 0;
            let isEnding = false;
            let typingTimer = null;
            let transitionTimer = null;
            let q16DisagreeCount = 0;            // Q16连续不同意次数
            let isSpecialTransitionRunning = false;

            // 长按重置相关
            let pressTimer = null;
            let isPressing = false;
            const RESET_HOLD_TIME = 10000;

            // DOM 元素
            const questionText = document.getElementById('questionText');
            const optionsArea = document.getElementById('optionsArea');
            const transitionLine = document.getElementById('transitionLine');
            const container = document.getElementById('appContainer');
            const body = document.body;
            const resetHint = document.getElementById('resetHint');

            function getOptionA() { return document.getElementById('optionA'); }
            function getOptionB() { return document.getElementById('optionB'); }

            const STORAGE_KEY = 'quiz_final_state_corli';

            // ---------- 长按重置功能 ----------
            function showResetHint(show) {
                if (show) {
                    resetHint.classList.add('visible');
                } else {
                    resetHint.classList.remove('visible');
                }
            }

            function handlePressStart(e) {
                if (!isEnding) return;
                if (e.target !== questionText) return;
                
                isPressing = true;
                showResetHint(true);
                
                if (pressTimer) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
                
                pressTimer = setTimeout(function() {
                    if (isPressing && isEnding) {
                        try {
                            localStorage.removeItem(STORAGE_KEY);
                            console.log('[调试] 已清除 localStorage，页面即将刷新');
                        } catch (e) {
                            console.warn('[调试] 清除 localStorage 失败:', e);
                        }
                        window.location.reload();
                    }
                    pressTimer = null;
                }, RESET_HOLD_TIME);
            }

            function handlePressEnd(e) {
                if (e.target !== questionText) return;
                isPressing = false;
                showResetHint(false);
                if (pressTimer) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
            }

            function handlePressCancel(e) {
                if (e.target !== questionText) return;
                isPressing = false;
                showResetHint(false);
                if (pressTimer) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
            }

            function bindResetEvents() {
                questionText.addEventListener('mousedown', handlePressStart);
                questionText.addEventListener('mouseup', handlePressEnd);
                questionText.addEventListener('mouseleave', handlePressCancel);
                questionText.addEventListener('touchstart', handlePressStart, { passive: true });
                questionText.addEventListener('touchend', handlePressEnd, { passive: true });
                questionText.addEventListener('touchcancel', handlePressCancel, { passive: true });
            }

            // ---------- 辅助函数 ----------
            function clearTimers() {
                if (typingTimer) { clearTimeout(typingTimer);
                    typingTimer = null; }
                if (transitionTimer) { clearTimeout(transitionTimer);
                    transitionTimer = null; }
            }

            function disableAllInteractions() {
                container.classList.add('no-interaction');
                optionsArea.classList.remove('visible');
                const optA = getOptionA();
                const optB = getOptionB();
                if (optA) optA.disabled = true;
                if (optB) optB.disabled = true;
            }

            function saveEndState(message, isLight) {
                const state = { ended: true, message, lightBackground: isLight, timestamp: Date.now() };
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
            }

            function checkStoredEnd() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return false;
                    const state = JSON.parse(raw);
                    if (state && state.ended) {
                        showEndScreen(state.message, state.lightBackground);
                        return true;
                    }
                } catch (e) {}
                return false;
            }

            function showEndScreen(message, isLight) {
                if (isEnding) return;
                isEnding = true;
                clearTimers();
                disableAllInteractions();
                optionsArea.classList.remove('visible');
                transitionLine.textContent = '';
                if (isLight) {
                    body.classList.add('bg-light');
                    body.style.backgroundColor = '#f0f0f0';
                    questionText.className = 'question-text end-message light';
                } else {
                    body.classList.remove('bg-light');
                    body.style.backgroundColor = '#000';
                    questionText.className = 'question-text end-message dark';
                }
                questionText.textContent = message;
                saveEndState(message, isLight);
                bindResetEvents();
            }

            function evaluateEnding() {
                if (isEnding) return true;
                if (tCountFromQ6 >= 9) {
                    showEndScreen('也许有一天你能找到现在的意义。\n3244', true);
                } else {
                    showEndScreen('也许过去发生的事情仍在继续。', false);
                }
                return true;
            }

            function showOptions(show) {
                if (show) optionsArea.classList.add('visible');
                else optionsArea.classList.remove('visible');
            }

            // ---------- 打字机效果 ----------
            function typeQuestion(text, callback) {
                if (isEnding) return;
                questionText.textContent = '';
                showOptions(false);
                let index = 0;
                const chars = text.split('');
                if (typingTimer) clearTimeout(typingTimer);

                function typeChar() {
                    if (isEnding) return;
                    if (index < chars.length) {
                        questionText.textContent += chars[index];
                        index++;
                        typingTimer = setTimeout(typeChar, 45 + Math.random() * 25);
                    } else {
                        typingTimer = null;
                        if (typeof callback === 'function') callback();
                    }
                }
                typeChar();
            }

            // ---------- 过渡句打字 ----------
            function showTransition(text, nextCallback) {
                if (isEnding) return;
                clearTimers();
                showOptions(false);
                questionText.textContent = '';
                transitionLine.textContent = '';
                let idx = 0;
                const chars = text.split('');
                if (typingTimer) clearTimeout(typingTimer);

                function typeTransition() {
                    if (isEnding) return;
                    if (idx < chars.length) {
                        transitionLine.textContent += chars[idx];
                        idx++;
                        typingTimer = setTimeout(typeTransition, 40 + Math.random() * 20);
                    } else {
                        typingTimer = null;
                        transitionTimer = setTimeout(() => {
                            transitionTimer = null;
                            transitionLine.textContent = '';
                            if (typeof nextCallback === 'function') nextCallback();
                        }, 5000);
                    }
                }
                typeTransition();
            }

            // ---------- 特殊过渡句 (连续三次不同意) ----------
            function showSpecialTransition(callback) {
                if (isEnding) return;
                isSpecialTransitionRunning = true;
                const lines = [
                    '你会理解我的',
                    '你会理解我的',
                    '你会理解我的',
                    '你会理解我的',
                    '你会理解我的',
                    '你会理解我的',
                    '你会理解我的',
                    '你会理解我的',
                    '你会理解我的',
                    '你会理解我的',
                    '你会理解我的',
                    '你会理解我的',
                    '你会理解我的'
                ];
                let lineIndex = 0;
                showOptions(false);
                questionText.textContent = '';
                transitionLine.textContent = '';
                transitionLine.style.whiteSpace = 'pre-wrap';
                transitionLine.style.lineHeight = '2.2';

                function showNextLine() {
                    if (isEnding) {
                        isSpecialTransitionRunning = false;
                        return;
                    }
                    if (lineIndex < lines.length) {
                        if (lineIndex === 0) {
                            transitionLine.textContent = lines[lineIndex];
                        } else {
                            transitionLine.textContent += '\n' + lines[lineIndex];
                        }
                        lineIndex++;
                        transitionTimer = setTimeout(showNextLine, 2000);
                    } else {
                        transitionTimer = null;
                        isSpecialTransitionRunning = false;
                        setTimeout(() => {
                            transitionLine.textContent = '';
                            transitionLine.style.whiteSpace = '';
                            if (typeof callback === 'function') callback();
                        }, 2000);
                    }
                }
                showNextLine();
            }

            // ---------- 加载问题 ----------
            function loadQuestion(index) {
                if (isEnding) return;
                if (isSpecialTransitionRunning) return;
                if (index >= QUESTIONS.length) {
                    evaluateEnding();
                    return;
                }

                transitionLine.textContent = '';
                const q = QUESTIONS[index];
                const optA = q.options[0];
                const optB = q.options[1];

                const btnA = getOptionA();
                const btnB = getOptionB();
                if (btnA) btnA.textContent = optA;
                if (btnB) btnB.textContent = optB;

                const parentA = btnA ? btnA.parentNode : null;
                const parentB = btnB ? btnB.parentNode : null;

                if (parentA) {
                    const newA = btnA.cloneNode(true);
                    parentA.replaceChild(newA, btnA);
                }
                if (parentB) {
                    const newB = btnB.cloneNode(true);
                    parentB.replaceChild(newB, btnB);
                }

                const newBtnA = getOptionA();
                const newBtnB = getOptionB();

                if (newBtnA) {
                    newBtnA.addEventListener('click', function handlerA() {
                        handleOption(0, index);
                    });
                }
                if (newBtnB) {
                    newBtnB.addEventListener('click', function handlerB() {
                        handleOption(1, index);
                    });
                }

                const afterTyping = function() {
                    if (isEnding) return;
                    showOptions(true);
                };

                typeQuestion(q.question, afterTyping);
            }

            // ---------- 处理选项 ----------
            function handleOption(selectedIdx, qIndex) {
                if (isEnding) return;
                if (isSpecialTransitionRunning) return;
                optionsArea.classList.remove('visible');

                const q = QUESTIONS[qIndex];
                const flag = q.flags[selectedIdx];
                
                if (flag === 'T') {
                    tCount++;
                    if (qIndex >= 5) tCountFromQ6++;
                } else {
                    fCount++;
                    if (qIndex >= 5) fCountFromQ6++;
                }

                // ---------- Q16 特殊逻辑 (索引15) ----------
                if (qIndex === 15) {
                    if (selectedIdx === 1) {
                        // 选择不同意
                        q16DisagreeCount++;
                        
                        if (q16DisagreeCount >= 3) {
                            // 连续三次不同意 -> 显示特殊过渡句，然后进入结局
                            showSpecialTransition(function() {
                                if (isEnding) return;
                                transitionLine.textContent = '';
                                evaluateEnding();
                            });
                            return;
                        } else {
                            // 未满三次，再问一次Q16
                            setTimeout(() => { loadQuestion(15); }, 300);
                            return;
                        }
                    } else {
                        // 选择同意 -> 直接进入结局（无论之前选过几次不同意）
                        setTimeout(() => { evaluateEnding(); }, 400);
                        return;
                    }
                }

                // ---------- 过渡句逻辑 ----------
                const nextIndex = qIndex + 1;
                let transitionText = '';
                let isTransitionPoint = false;

                if (qIndex === 0) {
                    transitionText = '之前我提出的问题，你想得怎么样？是不是有点难？老师的问题有点太深奥了，也不知道他老人家怎么想的。';
                    isTransitionPoint = true;
                } else if (qIndex === 2) {
                    transitionText = '你看到那些人们为了生存建立了所谓的“国家”，真被老师说中了，人们组成团体却不合作。';
                    isTransitionPoint = true;
                } else if (qIndex === 4) {
                    if (tCount < 4) {
                        transitionText = '看来您最近有些疲惫了，探索者，希望您可以休息一会儿，但时候不多了。';
                    } else {
                        transitionText = '我们继续吧，这样的休闲时光很短暂。';
                    }
                    isTransitionPoint = true;
                    
                    const firstText = transitionText;
                    const secondText = '接下来你只用回答同意或者不同意即可，请遵从自己的内心。';
                    
                    tCount = 0;
                    fCount = 0;
                    tCountFromQ6 = 0;
                    fCountFromQ6 = 0;

                    showTransition(firstText, function() {
                        if (isEnding) return;
                        transitionLine.textContent = '';
                        showTransition(secondText, function() {
                            if (isEnding) return;
                            transitionLine.textContent = '';
                            if (nextIndex < QUESTIONS.length) {
                                loadQuestion(nextIndex);
                            }
                        });
                    });
                    return;
                } else if (qIndex === 12) {
                    if (tCountFromQ6 < 6) {
                        transitionText = '这是你在坚持这些毫无意义的事情的理由吗？';
                    } else {
                        transitionText = '那你还在坚持什么呢？';
                    }
                    isTransitionPoint = true;
                }

                // 离开Q16时重置计数器
                if (qIndex !== 15) {
                    q16DisagreeCount = 0;
                }

                if (isTransitionPoint && transitionText) {
                    showTransition(transitionText, function() {
                        if (isEnding) return;
                        transitionLine.textContent = '';
                        if (nextIndex < QUESTIONS.length) {
                            loadQuestion(nextIndex);
                        } else {
                            evaluateEnding();
                        }
                    });
                } else {
                    setTimeout(() => {
                        if (isEnding) return;
                        if (nextIndex < QUESTIONS.length) {
                            loadQuestion(nextIndex);
                        } else {
                            evaluateEnding();
                        }
                    }, 400);
                }
            }

            // ---------- 初始化 ----------
            function init() {
                if (checkStoredEnd()) {
                    return;
                }
                
                currentIndex = 0;
                tCount = 0;
                fCount = 0;
                tCountFromQ6 = 0;
                fCountFromQ6 = 0;
                isEnding = false;
                q16DisagreeCount = 0;
                isSpecialTransitionRunning = false;
                body.classList.remove('bg-light');
                body.style.backgroundColor = '#000';
                questionText.className = 'question-text';
                transitionLine.textContent = '';
                transitionLine.style.whiteSpace = '';
                showOptions(false);
                container.classList.remove('no-interaction');
                loadQuestion(0);
            }

            window.addEventListener('load', init);
        })();
    </script>
</body>
</html>
